# =====================================================================
#  CONFIGURACIÓN DEL PORTAL CIUDADANO (Prototipo 2)
#  Consulta y seguimiento de denuncias mediante código
# =====================================================================

spring.application.name=portal-ciudadano
# Puerto distinto al del primer prototipo (8080) para poder ejecutar ambos a la vez
server.port=${PORT:8081}
# Render atiende HTTPS delante de la aplicación: se respetan sus cabeceras X-Forwarded-*
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------
#  CONEXIÓN A PostgreSQL (Aiven, plan gratuito)
#  Es la MISMA base de datos del primer prototipo. En Render se ponen las
#  mismas variables de entorno DB_URL, DB_USER y DB_PASSWORD.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_denuncias}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Crea las tablas que falten (mismo archivo que el primer prototipo, con IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------------
#  JPA / HIBERNATE
#  ddl-auto=none -> la estructura la definen los scripts SQL
#  (01 del primer prototipo y 02_portal_ciudadano.sql de este proyecto)
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
# Cambia a true si quieres ver en consola las consultas SQL que se ejecutan
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
#  SESIÓN DEL CIUDADANO
# ---------------------------------------------------------------------
# La consulta se cierra sola tras 15 minutos sin actividad
server.servlet.session.timeout=15m
# Nombre propio para la cookie: los dos prototipos corren en "localhost" y, si
# ambos usaran el nombre por defecto (JSESSIONID), se cerrarían la sesión entre sí
server.servlet.session.cookie.name=PORTALSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ---------------------------------------------------------------------
#  OPCIONES DEL PORTAL
# ---------------------------------------------------------------------
# Intentos de PIN permitidos antes de bloquear la consulta y minutos de bloqueo
app.portal.pin.max-intentos=5
app.portal.pin.minutos-bloqueo=15
# true = el ciudadano ve en el historial las observaciones que escriben los
# funcionarios al actualizar la denuncia; false = solo ve el cambio de estado
app.portal.mostrar-observaciones=true
# Los archivos que envía el funcionario por el chat se leen de la tabla
# archivo_almacenado de la base compartida (la escribe el primer prototipo).

# ---------------------------------------------------------------------
#  DATOS DE DEMOSTRACIÓN (se aplican al arrancar, solo donde falten)
# ---------------------------------------------------------------------
# PIN que reciben los ciudadanos que todavía no tienen uno
app.demo.pin=123456
# true = agrega dos denuncias más al ciudadano de D-000584 para que la pantalla
# "Mis denuncias registradas" muestre un historial (también aparecerán en el primer prototipo)
app.demo.denuncias-extra=true

# El navegador siempre pide la versión más reciente de los HTML, CSS y JS
# (evita ver una versión antigua después de hacer cambios)
spring.web.resources.cache.cachecontrol.no-cache=true
